<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#04060b"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background hexagon -->
  <polygon points="32,4 58,18 58,46 32,60 6,46 6,18" fill="url(#bgGrad)" stroke="#00f0ff" stroke-width="2" stroke-opacity="0.8"/>
  
  <!-- Cyber circuit nodes -->
  <circle cx="32" cy="14" r="2.5" fill="#00f0ff" filter="url(#glow)"/>
  <circle cx="16" cy="40" r="2.5" fill="#a855f7"/>
  <circle cx="48" cy="40" r="2.5" fill="#a855f7"/>

  <!-- Circuit lines -->
  <path d="M32 16 L32 24 M20 38 L26 32 M44 38 L38 32" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>

  <!-- Robot / AI Visor face -->
  <rect x="20" y="24" width="24" height="16" rx="4" fill="#0f172a" stroke="url(#cyanGrad)" stroke-width="1.8"/>
  
  <!-- Glowing Eyes / Data Stream -->
  <rect x="24" y="29" width="5" height="5" rx="1.5" fill="#00f0ff" filter="url(#glow)"/>
  <rect x="35" y="29" width="5" height="5" rx="1.5" fill="#00f0ff" filter="url(#glow)"/>

  <!-- Audio wave / mouth line -->
  <path d="M26 47 L30 47 L32 44 L34 50 L36 47 L38 47" stroke="#10b981" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
